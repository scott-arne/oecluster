[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oecluster"
version = "5.11.1"
description = "High-performance pairwise distance and clustering for OpenEye Toolkits"
requires-python = ">=3.11"
dependencies = ["openeye-toolkits>=2026.1", "numpy>=1.20", "oefp==0.3.0"]

[project.scripts]
oepdist = "_oepdist_main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn>=1.3", "scipy>=1.7", "vrzn>=0.1.0"]

[tool.setuptools]
packages = ["oecluster"]
py-modules = ["_oepdist_main"]
