[build-system]
# pyarrow is a build-only dependency: the oefp core compiled into this extension
# calls find_package(ArrowPython REQUIRED), and pyarrow's wheel is where the
# Arrow headers and libraries come from. The repaired wheel vendors its Arrow,
# so this constraint decides which Arrow gets bundled and must stay in step with
# the pyarrow oefp itself links against. Mirrored by PYARROW_REQUIREMENT in
# .github/workflows/build-wheels.yml.
requires = ["scikit-build-core>=0.8", "swig>=4.0", "pyarrow>=25,<26"]
build-backend = "scikit_build_core.build"

[project]
name = "oecluster"
version = "5.2.0"
description = "High-performance pairwise distance and clustering for OpenEye Toolkits"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Your Name", email = "your.email@example.com"}]
keywords = ["chemistry", "clustering", "pairwise distance", "openeye", "cheminformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The floor is set by openeye-toolkits, not by anything in this package: 2026.1
# is the first release with py314 wheels and the first to drop py310, and the
# extension links its OpenEye shared libraries by versioned soname, so the
# runtime toolkit has to be the one the wheel was built against.
requires-python = ">=3.11"
dependencies = ["openeye-toolkits>=2026.1", "numpy>=1.20", "oefp==0.3.0"]

[project.scripts]
oepdist = "_oepdist_main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn>=1.3", "scipy>=1.7", "vrzn>=0.1.0"]
docs = [
    "breathe>=4.35",
    "exhale>=0.3",
    "invoke>=2.0",
    "myst-parser>=2.0",
    "sphinx>=7.0",
    "sphinx-autobuild>=2024.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build.targets = ["oecluster_python", "oepdist"]
build-dir = "build/{wheel_tag}"
wheel.install-dir = "."
# Stable-ABI floor for the compiled extension, deliberately lower than
# requires-python: cp310-abi3 wheels load on every later minor, and lowering the
# floor costs nothing while requires-python is what actually gates installs.
wheel.py-api = "cp310"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]
logging.level = "INFO"
strict-config = false

[tool.scikit-build.cmake.define]
OECLUSTER_BUILD_TESTS = "OFF"
OECLUSTER_BUILD_TOOLS = "ON"
OECLUSTER_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OECLUSTER_USE_STABLE_ABI = "ON"
OECLUSTER_UNIVERSAL2 = "ON"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oecluster"
cmake-test-flag = "OECLUSTER_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# OpenEye libraries that are expected to be missing from delocate
# (they are provided at runtime by openeye-toolkits, not bundled in the wheel)
expected-missing-libs = [
    "liboechem", "liboesystem", "liboeplatform",
    "liboemath", "libzstd",
    "liboegraphsim",
    "liboeshape", "liboehermite", "liboeopt", "liboemolpotential",
    "liboebio",
    "liboegrid", "liboezap", "liboespicoli", "liboesitehopper",
    "liboespruce",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
extend-exclude = [
    "python/oecluster/oecluster.py",
    "python/oeselect",
]

[tool.ruff.lint.per-file-ignores]
"python/oecluster/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "^python/oecluster/oecluster\\.py$",
    "^python/oecluster/_build_info\\.py$",
    "^python/oeselect/",
]

# ----------------------------------------------------------------------------------------
# Pyright / Pylance configuration (type checking and editor analysis)
# https://microsoft.github.io/pyright/#/configuration
# ----------------------------------------------------------------------------------------
# Restrict analysis to this project's own source so Pylance does not crawl build
# artifacts, scratch data, vendored trees, or the interpreter's site-packages.
# Combined with the editor's workspace diagnostic mode this checks every project
# file (open or not) while keeping memory bounded.
[tool.pyright]
include = ["python", "tests"]
exclude = [
    "**/__pycache__",
    "**/.*",
    "build",
    "build-*",
    "cmake-build-*",
    "dist",
    "**/*.egg-info",
]
